      --bar: #f5f5f8;
      --line: #dcdce6;
      --rule: #eeeef3;
      --ink: #24242e;
      --muted: #565566;
      --accent: #523897;
      --chip: #f0ebfb;
      --edge: #d9cdf4;
      --rail: #ad97de;
    }
    @media (prefers-color-scheme: dark) {
