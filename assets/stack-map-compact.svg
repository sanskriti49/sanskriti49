  <desc id="description">Interface — React.js, JavaScript, TypeScript. API &amp; services — Java, Node.js, Express.js, REST APIs, Socket.IO, FastAPI. Data — PostgreSQL, SQL, Redis, MongoDB, PostGIS. ML &amp; retrieval — Python, PyTorch, scikit-learn, NumPy, RAG. Delivery &amp; tests — Git, Docker, GitHub Actions, Playwright, k6, AWS (EC2, S3).</desc>
  <style>
    svg {
