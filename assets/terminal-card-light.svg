<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="586" viewBox="0 0 1180 586" role="img" aria-labelledby="title desc">
<title id="title">Sanskriti Gupta hacker terminal profile</title>
<desc id="desc">A terminal-style profile card with Sanskriti Gupta's ASCII portrait and system information.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3FAF7"/><stop offset="1" stop-color="#E7F5EF"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#38BDF8" opacity=".04"/></pattern>
  <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#075E46" stop-opacity="0"/>
    <stop offset="50%" stop-color="#075E46" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#075E46" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="photoClip"><rect x="30" y="90" width="460" height="420" rx="12"/></clipPath>
  <style>
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "DejaVu Sans Mono", monospace; }
    .key { fill: #075E46; font-size: 15px; font-weight: bold; }
    .ascii { fill: #075E46; font-size: 10px; white-space: pre; }
    .value { fill: #102A23; font-size: 15px; }
    .label { fill: #075985; font-size: 11px; letter-spacing: 2px; }
    .muted { fill: #417566; font-size: 11px; letter-spacing: 1px; }
    .screen-label { fill: #075E46; font-size: 11px; letter-spacing: 1.5px; font-weight: bold; }
    .screen-muted { fill: #417566; font-size: 10px; letter-spacing: 1px; }
    .blink { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.25; } }
  </style>
</defs>
<rect width="1180" height="586" rx="18" fill="url(#bg)" stroke="#087F5B" stroke-width="2"/>
<rect x="14" y="18" width="488" height="540" rx="14" fill="#E7F5EF" stroke="#7DB8A1"/>
<rect x="508" y="18" width="655" height="540" rx="14" fill="#E7F5EF" stroke="#7DB8A1"/>
<circle cx="30" cy="20" r="5" fill="#EF4444"/><circle cx="48" cy="20" r="5" fill="#F59E0B"/><circle cx="66" cy="20" r="5" fill="#10B981"/>
<text x="590" y="25" text-anchor="middle" class="mono muted">sanskriti@forge ~ % ./profile.sh --live</text>
<circle cx="1030" cy="20" r="4" fill="#087F5B" class="blink"/><text x="1042" y="24" class="mono muted">LIVE // VERIFIED</text>
<text x="30" y="48" class="mono label">VISUAL.MAP</text><text x="524" y="48" class="mono label">SYSTEM.INFO</text>

