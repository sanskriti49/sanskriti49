<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="586" viewBox="0 0 1180 586" role="img" aria-labelledby="title desc">
<title id="title">Sanskriti Gupta hacker terminal profile</title>
<desc id="desc">A terminal-style profile card with a duotone portrait and system information.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3FAF7"/><stop offset="1" stop-color="#E7F5EF"/></linearGradient>
  <linearGradient id="photoTint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#075E46"/></linearGradient>
  <linearGradient id="asciiTint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#075E46"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#075985" opacity=".07"/></pattern>
  <clipPath id="photoClip"><rect x="30" y="90" width="460" height="420" rx="12"/></clipPath>
  <style>
    .mono { font-family: "Courier New", Consolas, monospace; }
    .key { fill: #075E46; font-size: 15px; font-weight: bold; }
    .ascii { fill: url(#asciiTint); font-size: 8px; letter-spacing: 1px; }
    .value { fill: #102A23; font-size: 15px; }
    .label { fill: #075985; font-size: 11px; letter-spacing: 2px; }
    .muted { fill: #417566; font-size: 11px; letter-spacing: 1px; }
    .scan { animation: scan 4.4s linear infinite; }
    .blink { animation: blink 1.1s steps(2, end) infinite; }
    .glitch { animation: glitch 3.2s steps(2, end) infinite; }
    @keyframes scan { from { transform: translateY(-440px); } to { transform: translateY(440px); } }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: .15; } }
    @keyframes glitch { 0%, 92%, 100% { transform: translate(0); } 94% { transform: translate(3px, -1px); } 96% { transform: translate(-3px, 1px); } }
  </style>
</defs>
