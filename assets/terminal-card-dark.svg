    <!-- legs -->
    <line x1="510" y1="273" x2="506" y2="270" stroke="#22C55E" stroke-width="1"/>
    <line x1="510" y1="275" x2="506" y2="278" stroke="#22C55E" stroke-width="1"/>
    <line x1="526" y1="273" x2="530" y2="270" stroke="#22C55E" stroke-width="1"/>
