<svg xmlns="http://www.w3.org/2000/svg" width="840" height="552" viewBox="0 0 840 552" role="img" aria-label="Terminal card: Sanskriti Gupta, Full-Stack and Backend Engineering. About: I build web apps and spend a questionable amount of time debugging them. Projects: taskgenie, udaan, flux. Stack: Java, JavaScript, TypeScript, Python, React, Next.js, Node.js, Express, PostgreSQL, MongoDB, Redis, AWS, Docker, Terraform." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22C55E"/><stop offset="50%" stop-color="#10B981"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#BAE6FD"/><stop offset="55%" stop-color="#7DD3FC"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <radialGradient id="bgGlow" cx="25%" cy="15%" r="90%"><stop offset="0%" stop-color="#0B1120"/><stop offset="100%" stop-color="#050816"/></radialGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#7DD3FC" opacity="0.05"/></pattern>
  <style>
    text, tspan { white-space: pre; font-family: "SFMono-Regular","JetBrains Mono","Fira Code",Consolas,"Courier New","DejaVu Sans Mono",monospace; }
    .ps { font-size:14px; fill:#22C55E; font-weight:bold }
    .cmd { font-size:14px; fill:#FFFFFF }
    .cm { font-size:13px; fill:#7FA896; font-style:italic}
    .name { font-size:44px; font-weight:bold; fill:url(#nameGrad); letter-spacing:-1px }
    .sub { font-size:16px; fill:#E2E8F0 }
    .val { font-size:14px; fill:#E2E8F0 }
    .acc { font-size:14px; fill:#86EFAC }
    .pn { font-size:14px; fill:#94A3B8 }
    .dir { font-size:14px; fill:#7DD3FC; font-weight:bold }
    .pill { font-size:12px }
    .node { font-size:11px; fill:#E2E8F0 }
    .term { font-size:12px; fill:#86EFAC; opacity:.85; letter-spacing:.5px }
    /* final state is the default; animation only enhances */
    .r { animation: wipe var(--d,.4s) ease-out both; animation-delay: var(--t,0s) }
    .f { animation: fade .3s ease-out both; animation-delay: var(--t,0s) }
    .spine { stroke-dasharray:438; animation: draw 5.80s linear both; animation-delay:.4s }
    .blink { animation: blink 1.1s steps(1,end) infinite; animation-delay: var(--t,0s) }
    @keyframes wipe { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    @keyframes fade { from { opacity:0 } to { opacity:1 } }
    @keyframes draw { from { stroke-dashoffset:438 } to { stroke-dashoffset:0 } }
    @keyframes blink { 0% { opacity:1 } 50% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .r, .f, .spine, .blink { animation:none !important }
      .packet { display:none }
    }
  </style>
</defs>
