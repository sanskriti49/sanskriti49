<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="586" viewBox="0 0 1180 586" role="img" aria-labelledby="title desc">
  <title id="title">Sanskriti Gupta developer profile console</title>
  <desc id="desc">A terminal-style visual map and system information panel for Sanskriti Gupta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="586" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111B"/><stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22C55E"/><stop offset=".5" stop-color="#10B981"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"><animate attributeName="stop-color" values="#38BDF8;#22D3EE;#60A5FA;#38BDF8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#60A5FA;#38BDF8;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#7DD3FC" opacity=".04"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: "Courier New", Consolas, monospace; }
      .ascii { font-size: 8px; fill: url(#text); letter-spacing: 1px; }
      .key { font-size: 15px; fill: #4ADE80; font-weight: bold; }
      .value { font-size: 15px; fill: #F8FAFC; }
      .muted { font-size: 12px; fill: #64748B; letter-spacing: 1px; }
      .label { font-size: 11px; fill: #38BDF8; letter-spacing: 2px; }
      .heading { font-size: 17px; fill: #22C55E; font-weight: bold; }
      .blink { animation: blink 1.1s infinite; }
      @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: .15; } }
    </style>
  </defs>
  <rect width="1180" height="586" rx="18" fill="url(#bg)"/><rect width="1180" height="586" rx="18" fill="url(#scanlines)"/>
  <rect x="3" y="3" width="1174" height="580" rx="16" fill="none" stroke="url(#border)"/>
  <rect x="14" y="18" width="488" height="540" rx="14" fill="#07111B" fill-opacity=".65" stroke="url(#border)" opacity=".65"/>
  <rect x="508" y="18" width="655" height="540" rx="14" fill="#07111B" fill-opacity=".65" stroke="url(#border)" opacity=".65"/>
  <circle cx="28" cy="20" r="5" fill="#EF4444"/><circle cx="46" cy="20" r="5" fill="#F59E0B"/><circle cx="64" cy="20" r="5" fill="#10B981"/>
  <text x="590" y="25" text-anchor="middle" class="mono muted">sanskriti@github ~ % ./profile.sh --live</text>
  <circle cx="1070" cy="20" r="4" fill="#F87171" class="blink"/><text x="1082" y="24" class="mono muted">SCANNING</text>
  <text x="30" y="44" class="mono label">VISUAL.MAP</text><text x="524" y="44" class="mono label">SYSTEM.INFO</text>

