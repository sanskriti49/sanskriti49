<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sanskriti's developer radar</title>
  <desc id="desc">A green terminal-style radar showing frontend, backend, and applied machine learning areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B12"/>
      <stop offset="1" stop-color="#07151A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#39FF88" stop-opacity=".32"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#123C3A" stroke-opacity=".5"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="url(#bg)" stroke="#19D886" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="320" rx="12" fill="url(#grid)" stroke="#0B7661"/>
  <circle cx="45" cy="45" r="6" fill="#FF5F57"/>
  <circle cx="65" cy="45" r="6" fill="#FFBD2E"/>
  <circle cx="85" cy="45" r="6" fill="#28C840"/>
  <text x="110" y="50" fill="#7AF5B2" font-family="monospace" font-size="14">sanskriti@github: ~/profile --live</text>
  <line x1="42" y1="70" x2="1158" y2="70" stroke="#145C4F"/>

  <rect x="42" y="92" width="470" height="220" rx="12" fill="#06121A" fill-opacity=".85" stroke="#0D9070"/>
  <text x="62" y="119" fill="#44EFA0" font-family="monospace" font-size="14">VISUAL RADAR / ACTIVE AREAS</text>
  <circle cx="277" cy="205" r="91" fill="url(#glow)"/>
  <circle cx="277" cy="205" r="88" stroke="#117C61"/>
  <circle cx="277" cy="205" r="61" stroke="#117C61"/>
  <circle cx="277" cy="205" r="31" stroke="#117C61"/>
  <path d="M277 205L332 132" stroke="#42FFA0" stroke-width="2" filter="url(#softGlow)"/>
  <path d="M277 117V293M189 205H365" stroke="#16745D"/>
  <circle cx="332" cy="132" r="7" fill="#A0FFC2" filter="url(#softGlow)"/>
  <circle cx="225" cy="163" r="5" fill="#41D985"/>
  <circle cx="345" cy="245" r="5" fill="#41D985"/>
  <circle cx="202" cy="249" r="4" fill="#41D985"/>
  <circle cx="298" cy="274" r="5" fill="#41D985"/>
  <text x="340" y="128" fill="#A0FFC2" font-family="monospace" font-size="12">REACT</text>
  <text x="348" y="263" fill="#6CEBA2" font-family="monospace" font-size="12">NODE</text>
  <text x="165" y="270" fill="#6CEBA2" font-family="monospace" font-size="12">PYTHON</text>
  <text x="185" y="153" fill="#6CEBA2" font-family="monospace" font-size="12">ML / NLP</text>
  <text x="62" y="300" fill="#257F69" font-family="monospace" font-size="11">signal locked // projects online</text>

  <rect x="532" y="92" width="626" height="220" rx="12" fill="#06121A" fill-opacity=".85" stroke="#0D9070"/>
  <text x="558" y="124" fill="#44EFA0" font-family="monospace" font-size="20">SYSTEM.INFO</text>
  <text x="558" y="157" fill="#7DFFB5" font-family="monospace" font-size="16">Sanskriti</text>
  <text x="558" y="184" fill="#44EFA0" font-family="monospace" font-size="13">Role        </text><text x="670" y="184" fill="#D0FFE1" font-family="monospace" font-size="13">Full-stack developer</text>
  <text x="558" y="208" fill="#44EFA0" font-family="monospace" font-size="13">Focus       </text><text x="670" y="208" fill="#D0FFE1" font-family="monospace" font-size="13">Useful products and clean UI</text>
  <text x="558" y="232" fill="#44EFA0" font-family="monospace" font-size="13">Frontend    </text><text x="670" y="232" fill="#D0FFE1" font-family="monospace" font-size="13">React, Vite, Tailwind CSS</text>
  <text x="558" y="256" fill="#44EFA0" font-family="monospace" font-size="13">Backend     </text><text x="670" y="256" fill="#D0FFE1" font-family="monospace" font-size="13">Node.js, Express, Flask</text>
  <text x="558" y="280" fill="#44EFA0" font-family="monospace" font-size="13">Data        </text><text x="670" y="280" fill="#D0FFE1" font-family="monospace" font-size="13">Python, scikit-learn, MongoDB</text>
  <text x="558" y="304" fill="#44EFA0" font-family="monospace" font-size="13">Status      </text><text x="670" y="304" fill="#A0FFC2" font-family="monospace" font-size="13">building // learning // shipping</text>
</svg>
