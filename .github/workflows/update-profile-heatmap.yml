name: Update profile heatmap

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate terminal profile card
        env:
          PROFILE_PHOTO: assets/profile-photo.jpg
          TERMINAL_OUTPUT_DIR: assets
        run: node scripts/generate-terminal-card.mjs
      - name: Generate contribution HUD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sanskriti49
        run: python scripts/generate_heatmap.py
      - name: Commit refreshed heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-heatmap.svg assets/terminal-card-dark.svg assets/terminal-card-light.svg README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile contribution heatmap"
          git push
